<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>¿Qué sigue?</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <form id="rapido" class="rapido">
    <input id="rapido-texto" type="text" placeholder="10am revisar propuesta · en 30 min llamar" autocomplete="off">
    <input id="rapido-hora" type="time" title="Hora (opcional si la escribes en el texto)">
    <select id="rapido-repetir" title="Repetir">
      <option value="no">Una vez</option>
      <option value="diario">Diario</option>
      <option value="laborables">L a V</option>
    </select>
    <button type="submit">Recordar</button>
  </form>
  <p id="aviso" class="aviso" hidden></p>

  <nav class="tabs">
    <button data-tab="ahora" class="activa">Ahora</button>
    <button data-tab="recordatorios">Recordatorios <span id="n-rec"></span></button>
    <button data-tab="taskai">TaskAI <span id="n-taskai"></span></button>
    <span class="spacer"></span>
    <button id="refrescar" title="Revisar Linear ya">↻</button>
    <button id="ajustes" title="Ajustes">⚙</button>
  </nav>

  <main id="ahora"></main>
  <main id="recordatorios" hidden></main>
  <main id="taskai" hidden></main>

  <script type="module" src="popup.js"></script>
</body>
</html>
