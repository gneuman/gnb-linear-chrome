<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ajustes · ¿Qué sigue?</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 560px; max-height: none; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { width: 100%; border: 1px solid var(--linea); background: var(--bg); border-radius: 6px; padding: 6px 8px; }
    small { color: var(--suave); }
  </style>
</head>
<body>
  <h1>Ajustes</h1>
  <form id="f">
    <label for="llave">API key personal de Linear</label>
    <input id="llave" type="password" autocomplete="off" placeholder="lin_api_…">
    <small>Linear → Settings → Security &amp; access → Personal API keys. Se guarda solo en este Chrome.</small>

    <label for="hora">Hora del resumen diario</label>
    <input id="hora" type="time">

    <label for="equipos">Equipos (claves separadas por coma)</label>
    <input id="equipos" type="text" placeholder="OP, INT, GRO — vacío = todos">

    <p><button class="primario" type="submit">Guardar</button> <span id="estado" class="aviso ok"></span></p>
  </form>
  <script type="module" src="options.js"></script>
</body>
</html>
